<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정치 조준 훈련소</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 관제실 화면 — 상단 상황판(문제·HUD), 중앙 사격 구역(arena), 오버레이로 시작/결과 */
:root{
  --bg:#0a1118; --panel:#111c27; --panel2:#17273a; --line:#26405c;
  --fg:#e8eef6; --mute:#8fa5bb; --accent:#ff7a3d; --ice:#7cc4ff;
  --ok:#3ddc97; --bad:#ff5d6c;
  --f-display:'Black Han Sans','Noto Sans KR',sans-serif;
  --f-body:'Noto Sans KR',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;
  padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,38px);line-height:1.1;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--mute);font-size:13px;margin:4px 0 0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;color:var(--fg)}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:700}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1b0d05}
.tab:focus-visible,select:focus-visible,.btn:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.board{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:start}
.qwrap{min-width:0}
.qlabel{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
#qtext{font-size:clamp(16px,2.6vw,20px);font-weight:700;margin:4px 0 0;min-height:3.1em;text-wrap:pretty}
#hint{font-family:var(--f-mono);font-weight:700;font-size:20px;letter-spacing:.18em;color:var(--accent);margin-top:6px;min-height:1.5em}
.hud{display:grid;grid-template-columns:repeat(3,auto);gap:4px 16px;text-align:right}
.hud div{min-width:0}
.hud b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.hud span{font-size:11px;color:var(--mute)}
.lives{display:flex;gap:5px;justify-content:flex-end;margin-top:6px;grid-column:1/-1}
.lives i{width:22px;height:8px;border-radius:2px;background:var(--bad)}
.lives i.off{background:var(--line)}
.bar{grid-column:1/-1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
#bar{height:100%;width:100%;background:var(--ice);transform-origin:left;transition:background .2s}
#bar.low{background:var(--bad)}
.arena{position:relative;height:clamp(380px,60vh,540px);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:
   radial-gradient(circle at 50% 50%,transparent 0 22%,rgba(124,196,255,.07) 22.4% 22.8%,transparent 23% 44%,rgba(124,196,255,.07) 44.4% 44.8%,transparent 45%),
   linear-gradient(var(--panel2),var(--bg));
  cursor:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.arena::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(124,196,255,.1)}
.arena::after{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(124,196,255,.1)}
.tgt{position:absolute;left:0;top:0;max-width:46%;padding:10px 14px;border-radius:10px;background:var(--panel);border:1.5px solid var(--ice);
  font-weight:700;font-size:15px;line-height:1.35;z-index:2;will-change:transform;text-align:center}
.tgt.ox{min-width:96px;font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1;padding:18px 26px;border-radius:50%;max-width:none}
.tgt.ox.o{border-color:var(--ok);color:var(--ok)}
.tgt.ox.x{border-color:var(--bad);color:var(--bad)}
.tgt.right{background:var(--ok);border-color:var(--ok);color:#06210f}
.tgt.wrong{background:var(--bad);border-color:var(--bad);color:#2a0409}
.card{position:absolute;left:0;top:0;width:min(230px,58%);padding:10px 12px;border-radius:8px;background:var(--panel);border:1.5px solid var(--mute);
  font-size:13.5px;line-height:1.4;font-weight:500;z-index:2;will-change:transform}
.card.right{background:var(--ok);border-color:var(--ok);color:#06210f}
.card.wrong{background:var(--bad);border-color:var(--bad);color:#2a0409}
.card.gone{opacity:0;transition:opacity .25s}
.baseline{position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,var(--accent) 0 14px,transparent 14px 22px);opacity:.55;z-index:1;display:none}
.arena.wave .baseline{display:block}
#cross{position:absolute;left:0;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;pointer-events:none;z-index:5;display:none}
#cross::before,#cross::after{content:"";position:absolute;background:var(--accent)}
#cross::before{left:17px;top:0;width:2px;height:36px}
#cross::after{top:17px;left:0;height:2px;width:36px}
#cross i{position:absolute;inset:8px;border:2px solid var(--accent);border-radius:50%}
.ping{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid var(--accent);border-radius:50%;pointer-events:none;z-index:4;animation:ping .45s ease-out forwards}
@keyframes ping{to{transform:scale(4);opacity:0}}
.pop{position:absolute;font-family:var(--f-mono);font-weight:700;pointer-events:none;z-index:6;animation:pop .8s ease-out forwards}
@keyframes pop{to{transform:translateY(-34px);opacity:0}}
#fb{position:absolute;left:12px;right:12px;bottom:14px;z-index:7;background:rgba(10,17,24,.92);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;display:none}
#fb.ok{border-color:var(--ok)}
#fb.bad{border-color:var(--bad)}
.ov{position:absolute;inset:0;z-index:10;background:rgba(10,17,24,.93);display:flex;align-items:center;justify-content:center;padding:18px;cursor:default;overflow-y:auto}
.ov .box{max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px}
.ov h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4.5vw,32px);margin:0;line-height:1.15}
.ov p{margin:0;color:var(--mute)}
.ov ul{margin:0;padding-left:18px;color:var(--fg);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--accent);color:#1b0d05;border:0;border-radius:8px;padding:11px 20px;min-height:44px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stats b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--mute)}
.notes{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;background:var(--panel)}
.notes div{padding:5px 0;border-bottom:1px solid var(--line)}
.notes div:last-child{border-bottom:0}
.notes b{color:var(--accent)}
.foot{color:var(--mute);font-size:12px}
@media (max-width:560px){.board{grid-template-columns:1fr}.hud{text-align:left}.lives{justify-content:flex-start}.tgt{font-size:13.5px;padding:8px 10px}}
@media (prefers-reduced-motion:reduce){.ping,.pop{animation-duration:.01s}}
</style>

</head><body>
<div class="wrap">
  <header>
    <div>
      <h1>정치 조준 훈련소</h1>

    </div>
    <div class="ctl">
      <label for="unit" class="foot">범위</label>
      <select id="unit">
        <option value="0">전체 (1~4단원)</option>
        <option value="1">1. 국제 사회의 이해</option>
        <option value="2">2. 국제 문제와 행위 주체</option>
        <option value="3">3. 우리나라의 국제 관계와 외교</option>

    <button class="tab" data-mode="ox" aria-pressed="false">OX 사격장</button>
    <button class="tab" data-mode="wave" aria-pressed="false">오개념 격파</button>

    </div>
    <div class="bar"><div id="bar"></div></div>
  </section>

  <div class="arena" id="arena">
    <div class="baseline"></div>
    <div id="cross"><i></i></div>
    <div id="fb"></div>
    <div class="ov" id="ov"></div>
  </div>
  <div class="row">
    <button class="btn ghost" id="quit" hidden>그만하기</button>
  </div>
  <p class="foot">시안입니다. 문제는 학습지에 나온 용어와 정의, OX 퀴즈 40문항만 사용합니다. 도구는 레이저 포인터입니다.</p>
</div>

function inUnit(t){return G.unit===0||t.unit===G.unit;}
function pickTerm(avoidId){
  var pool=TERMS.filter(function(t){return inUnit(t)&&t.id!==avoidId;});
  var tot=0,w=pool.map(function(t){var x=1+2*(weak[t.id]||0);tot+=x;return x;});
  var r=Math.random()*tot;
  for(var i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i];}
  return pool[pool.length-1];
}
function distractors(t,n){
  var same=shuffle(TERMS.filter(function(x){return x.id!==t.id&&x.g===t.g;}));
  var unit=shuffle(TERMS.filter(function(x){return x.id!==t.id&&x.g!==t.g&&x.unit===t.unit;}));
  var all=shuffle(TERMS.filter(function(x){return x.id!==t.id&&x.unit!==t.unit;}));
  return same.concat(unit,all).slice(0,n);
}
function makeAim(avoid){
  var t=pickTerm(avoid);
  var opts=shuffle([t].concat(distractors(t,4))).map(function(x){return {id:x.id,label:x.name};});
  return {t:t,q:t.def,hint:t.init,answer:t.id,opts:opts,explain:'정답: '+t.name};
}
function makeOX(){
  var curated=OXQ.filter(function(r){return G.unit===0||r[0]===G.unit;});
  var q;
  if(Math.random()<0.5&&curated.length){
    var r=curated[Math.floor(Math.random()*curated.length)];
    q={text:r[1],a:r[2],t:null,explain:r[2]?'옳은 문장입니다.':'틀린 문장입니다.'};
  }else{
    var t=pickTerm(-1);
    if(Math.random()<0.5){
      q={text:'「'+t.def+'」 = 「'+t.name+'」',a:true,t:t,explain:'옳은 문장입니다.'};
    }else{
      var d=distractors(t,2)[0];
      q={text:'「'+t.def+'」 = 「'+d.name+'」',a:false,t:t,explain:'틀린 문장입니다. 이 정의는 「'+t.name+'」입니다.'};
    }
  }
  return {t:q.t,q:q.text,hint:'',answer:q.a?'O':'X',opts:[{id:'O',label:'O'},{id:'X',label:'X'}],explain:q.explain,raw:q};
}
function makeStatement(wantFalse){
  for(var i=0;i<40;i++){
    var q=makeOX();
    if((q.answer==='X')===wantFalse)return q;
  }
  return makeOX();
}

function notesHtml(){
  var ids=Object.keys(weak).filter(function(k){return weak[k]>0;}).sort(function(a,b){return weak[b]-weak[a];}).slice(0,10);

}

  var wk=Object.keys(weak).filter(function(k){return weak[k]>0;}).length;
  ov.style.display='flex';
  ov.innerHTML='<div class="box"><h2>'+m.name+'</h2><p>'+m.desc+'</p><ul>'+m.tips.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>'+
   '<div class="stats"><div><b>'+(best[G.mode]||0)+'</b><span>최고 점수</span></div><div><b>'+wk+'</b><span>오답노트 용어</span></div></div>'+
   '<div class="row"><button class="btn" id="go">시작</button><button class="btn ghost" id="nt">오답노트 보기</button></div><div id="ntbox"></div></div>';
  $('#go').onclick=startGame;
  $('#nt').onclick=function(){var b=$('#ntbox');b.innerHTML=b.innerHTML?'':notesHtml();};
  $('#qlabel').textContent='MISSION';$('#qtext').textContent='시작을 누르면 훈련이 시작됩니다.';$('#hint').textContent='';
  setBar(1);G.score=0;G.combo=0;G.lives=3;hud();$('#rd').textContent='-';
  arena.classList.toggle('wave',G.mode==='wave');
  $('#rdl').textContent=G.mode==='wave'?'웨이브':'문항';
}
function showResult(cleared){
  G.running=false;cancelAnimationFrame(G.raf);clearField();$('#quit').hidden=true;
  var prev=best[G.mode]||0, isBest=G.score>prev;
  if(isBest){best[G.mode]=G.score;store.set('jb-best',best);}
  store.set('jb-weak',weak);
  var acc=G.shots?Math.round(100*G.hits/G.shots):0;
  var miss=G.missed.slice(0,6).map(function(m){return '<div>'+esc(m)+'</div>';}).join('');
  ov.style.display='flex';
  ov.innerHTML='<div class="box"><h2>'+(cleared?'작전 성공':'훈련 종료')+'</h2>'+
   '<div class="stats"><div><b>'+G.score+'</b><span>점수'+(isBest?' (최고 기록)':'')+'</span></div><div><b>'+G.maxCombo+'</b><span>최대 콤보</span></div><div><b>'+acc+'%</b><span>명중률</span></div></div>'+
   (miss?'<p>다시 볼 내용</p><div class="notes">'+miss+'</div>':'<p>틀린 문제가 없습니다.</p>')+
   '<div class="row"><button class="btn" id="again">다시 하기</button><button class="btn ghost" id="home">모드 선택</button></div></div>';
  $('#again').onclick=startGame;$('#home').onclick=showStart;
  $('#qtext').textContent='훈련이 끝났습니다.';$('#hint').textContent='';
}

/* ---------- 게임 시작 ---------- */
function startGame(){
  G.score=0;G.combo=0;G.maxCombo=0;G.lives=3;G.shots=0;G.hits=0;G.missed=[];G.round=0;G.locked=false;G.running=true;G.last=performance.now();
  ov.style.display='none';clearField();hud();$('#quit').hidden=false;
  arena.classList.toggle('wave',G.mode==='wave');
  $('#rdl').textContent=G.mode==='wave'?'웨이브':'문항';
  if(G.mode==='wave'){G.wave=1;beginWave();}else nextQ();
  cancelAnimationFrame(G.raf);G.raf=requestAnimationFrame(tick);
}
function loseLife(){
  G.lives--;G.combo=0;hud();
  return G.lives<=0;
}

/* ---------- 조준·OX 모드 ---------- */
function nextQ(){
  if(!G.running)return;
  clearField();G.locked=false;G.round++;
  $('#rd').textContent=G.round;
  var q=G.mode==='aim'?makeAim(G.q&&G.q.t?G.q.t.id:-1):makeOX();
  G.q=q;
  $('#qlabel').textContent=G.mode==='aim'?'정의에 해당하는 용어를 쏘세요':'참이면 O, 거짓이면 X';
  $('#qtext').textContent=q.q;$('#hint').textContent=q.hint;
  G.timeMax=Math.max(G.mode==='aim'?6:5,(G.mode==='aim'?14:11)-Math.floor(G.combo/3));
  G.timeLeft=G.timeMax;
  var W=arena.clientWidth,H=arena.clientHeight;
  G.targets=q.opts.map(function(o,i){
    var el=document.createElement('div');
    el.className='tgt'+(G.mode==='ox'?' ox '+o.id.toLowerCase():'');
    el.textContent=o.label;el.dataset.id=o.id;
    arena.appendChild(el);
    var w=el.offsetWidth,h=el.offsetHeight;
    var sp=(G.mode==='ox'?95:50)*SLOW*(1+Math.min(G.combo,15)*0.04);
    var ang=rnd(0,6.283);
    var t={el:el,id:o.id,w:w,h:h,x:rnd(8,Math.max(10,W-w-8)),y:rnd(8,Math.max(10,H-h-70)),vx:Math.cos(ang)*sp+Math.sign(Math.cos(ang))*20,vy:Math.sin(ang)*sp+Math.sign(Math.sin(ang))*20};
    el.style.transform='translate('+t.x+'px,'+t.y+'px)';
    return t;
  });
  if(G.mode==='ox'&&G.targets.length===2){
    G.targets[0].x=W*0.2;G.targets[1].x=W*0.62;
  }
}
function updateAim(dt){
  if(G.locked)return;
  var W=arena.clientWidth,H=arena.clientHeight;
  G.targets.forEach(function(t){
    t.x+=t.vx*dt;t.y+=t.vy*dt;
    if(t.x<0){t.x=0;t.vx=Math.abs(t.vx);}
    if(t.x>W-t.w){t.x=W-t.w;t.vx=-Math.abs(t.vx);}
    if(t.y<0){t.y=0;t.vy=Math.abs(t.vy);}
    if(t.y>H-t.h-4){t.y=H-t.h-4;t.vy=-Math.abs(t.vy);}
    t.el.style.transform='translate('+t.x+'px,'+t.y+'px)';
  });
  G.timeLeft-=dt;setBar(G.timeLeft/G.timeMax);
  if(G.timeLeft<=0)resolve(null,null);
}
function resolve(id,pt){
  if(G.locked)return;
  G.locked=true;
  var q=G.q,ok=(id!==null&&id===q.answer);
  G.targets.forEach(function(t){
    if(t.id===q.answer)t.el.classList.add('right');
    else if(t.id===id)t.el.classList.add('wrong');
  });
  if(ok){
    var gain=100+G.combo*10;
    var bonus=0;
    if(pt){
      var tg=G.targets.filter(function(t){return t.id===id;})[0];
      var cx=tg.x+tg.w/2,cy=tg.y+tg.h/2;
      if(Math.hypot(pt.x-cx,pt.y-cy)<Math.min(tg.w,tg.h)*0.3){bonus=50;}
    }
    G.score+=gain+bonus;G.combo++;G.hits++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    say((bonus?'정중앙! +'+bonus+' · ':'')+'정답 +'+gain+' · '+q.explain,'ok');
    hud();setTimeout(nextQ,G.mode==='ox'?650:800);
  }else{
    if(q.t)weak[q.t.id]=(weak[q.t.id]||0)+1;
    G.missed.push(G.mode==='aim'?q.q+' → '+q.t.name:q.q+' ('+(q.answer==='O'?'O':'X')+')');
    var dead=loseLife();
    say((id===null?'시간 초과 · ':'오답 · ')+q.explain,'bad');
    setTimeout(function(){if(dead)showResult(false);else nextQ();},1900);
  }
}

/* ---------- 웨이브 모드 ---------- */
function beginWave(){
  G.spawn=0;G.perWave=6+G.wave*2;G.spawnT=1.2;G.cards=[];G.pause=1.6;
  $('#rd').textContent=G.wave+' / 4';
  $('#qlabel').textContent='WAVE '+G.wave;
  $('#qtext').textContent='틀린 문장만 쏘세요. 옳은 문장은 통과시키면 됩니다.';
  $('#hint').textContent='';
  setBar(1);
  say('WAVE '+G.wave+' 시작 · 카드 '+G.perWave+'장','ok');
  setTimeout(hideFb,1400);
}
function spawnCard(){
  var q=makeStatement(Math.random()<0.55);
  var el=document.createElement('div');el.className='card';el.textContent=q.q;
  arena.appendChild(el);
  var W=arena.clientWidth;
  var c={el:el,q:q,w:el.offsetWidth,h:el.offsetHeight,x:0,y:-el.offsetHeight-4,v:(34+G.wave*9+rnd(0,14))*SLOW,dead:false};
  c.x=rnd(6,Math.max(8,W-c.w-6));
  el.style.transform='translate('+c.x+'px,'+c.y+'px)';
  G.cards.push(c);
}
function removeCard(c){
  c.dead=true;c.el.classList.add('gone');
  setTimeout(function(){c.el.remove();},260);
}
function updateWave(dt){
  if(G.pause>0){G.pause-=dt;return;}
  var H=arena.clientHeight;
  if(G.spawn<G.perWave){
    G.spawnT-=dt;
    if(G.spawnT<=0){spawnCard();G.spawn++;G.spawnT=Math.max(1.5,3.2-G.wave*0.35)+rnd(0,0.8);}
  }
  G.cards.forEach(function(c){
    if(c.dead)return;
    c.y+=c.v*dt;
    c.el.style.transform='translate('+c.x+'px,'+c.y+'px)';
    if(c.y+c.h>=H-8){
      if(c.q.answer==='X'){
        G.missed.push(c.q.q+' (X) — 놓친 틀린 문장');
        if(c.q.t)weak[c.q.t.id]=(weak[c.q.t.id]||0)+1;
        c.el.classList.add('wrong');say('틀린 문장이 기지에 도달했습니다. '+c.q.explain,'bad');
        setTimeout(hideFb,1800);
        if(loseLife()){removeCard(c);G.cards=G.cards.filter(function(k){return !k.dead;});showResult(false);return;}
      }
      removeCard(c);
    }
  });
  G.cards=G.cards.filter(function(c){return !c.dead;});
  if(!G.running)return;
  setBar(1-(G.spawn-G.cards.length)/G.perWave);
  if(G.spawn>=G.perWave&&G.cards.length===0){
    if(G.wave>=4){G.score+=200;showResult(true);return;}
    G.score+=100;G.wave++;hud();beginWave();
  }
}
function shootCard(c,pt){
  if(c.dead)return;
  G.shots++;
  if(c.q.answer==='X'){
    var gain=100+G.combo*10;G.score+=gain;G.combo++;G.hits++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    c.el.classList.add('right');pop(pt.x,pt.y,'+'+gain,'var(--ok)');
  }else{
    G.score=Math.max(0,G.score-50);G.combo=0;
    G.missed.push(c.q.q+' (O) — 옳은 문장을 쏨');
    c.el.classList.add('wrong');pop(pt.x,pt.y,'-50','var(--bad)');
  }
  hud();removeCard(c);
}

/* ---------- 루프·입력 ---------- */
function tick(ts){
  if(!G.running)return;
  var dt=Math.min(0.05,(ts-G.last)/1000);G.last=ts;
  if(G.mode==='wave')updateWave(dt);else updateAim(dt);
  if(G.running)G.raf=requestAnimationFrame(tick);
}
function localPt(e){var r=arena.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
arena.addEventListener('pointermove',function(e){
  if(e.pointerType==='touch')return;
  var p=localPt(e);cross.style.display='block';cross.style.transform='translate('+p.x+'px,'+p.y+'px)';
});
arena.addEventListener('pointerleave',function(){cross.style.display='none';});
arena.addEventListener('pointerdown',function(e){
  if(!G.running||ov.style.display!=='none')return;
  var p=localPt(e);
  var ring=document.createElement('div');ring.className='ping';ring.style.left=p.x+'px';ring.style.top=p.y+'px';arena.appendChild(ring);
  setTimeout(function(){ring.remove();},500);
  if(G.mode==='wave'){
    var cardEl=e.target.closest&&e.target.closest('.card');
    if(cardEl){
      var c=G.cards.filter(function(k){return k.el===cardEl;})[0];
      if(c)shootCard(c,p);
    }else{G.shots++;}
    return;
  }
  if(G.locked)return;
  G.shots++;
  var te=e.target.closest&&e.target.closest('.tgt');
  if(te){resolve(te.dataset.id,p);}
  else{G.combo=0;hud();pop(p.x,p.y,'빗나감','var(--mute)');}
});
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){
    G.mode=b.dataset.mode;
    document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
    showStart();
  });
});
$('#unit').addEventListener('change',function(e){G.unit=+e.target.value;if(!G.running)showStart();else showStart();});
$('#quit').addEventListener('click',function(){if(G.running)showResult(false);});
showStart();
})();
</script>
</body>
</html>
